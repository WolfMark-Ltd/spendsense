# Spend Sense feed counting — PREPARED, NOT INSTALLED.
#
# At activation: place in /etc/nginx/conf.d/spendsense-feed.conf (these
# directives need http context, so they cannot live in the vhost file).
# Requires libnginx-mod-http-geoip2 plus a local GeoLite2-Country.mmdb
# BEFORE this file lands; `nginx -t` gates every step.
#
# What gets recorded per feed request: METHOD STATUS COUNTRYCODE and nothing
# else. No IPs, timestamps, user agents, cookies or identifiers. Lookup
# misses become "Unknown". Country resolution happens in-process from the
# local database file; there is no per-request third-party lookup.

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 60m;
    $geoip2_feed_country country iso_code;
}

map $geoip2_feed_country $feed_country {
    default $geoip2_feed_country;
    ""      Unknown;
}

# Date only (never a full timestamp): lets the daily fold attribute each
# line to its own day. A non-matching timestamp yields an empty date, which
# the aggregator ignores like any malformed line.
map $time_iso8601 $feed_date {
    "~^(?<ymd>[0-9]{4}-[0-9]{2}-[0-9]{2})" $ymd;
}

log_format feed_count '$feed_date $request_method $status $feed_country';
