name: Source check
on:
  schedule:
    # Daily, 06:30 UTC. Runners are ephemeral: baselines come from the repo,
    # the previous report comes from the cache, and each run uploads its
    # candidate report as an artefact.
    - cron: '30 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Prior-report persistence without a service: restore the last report
      # so --prior can carry unresolved findings across a source outage.
      # If the cache ever evicts, the run degrades to no-prior: diffs still
      # recompute from the committed baselines, only outage carry-forward
      # is lost for that run.
      - uses: actions/cache/restore@v4
        with:
          path: source-check/report.json
          key: source-check-prior-${{ github.run_id }}
          restore-keys: source-check-prior-
      - run: |
          PRIOR=""
          [ -f source-check/report.json ] && PRIOR="--prior source-check/report.json"
          # Unquoted: expands to nothing on a cold cache.
          # shellcheck disable=SC2086
          python3 scripts/source-check.py --out source-check/report.json $PRIOR
        # --prior and --out share one path safely: main() loads the prior
        # report into memory before the fresh report is written.
      - run: python3 -c "import json; r=json.load(open('source-check/report.json')); print('## Source check', r['generated_at']); print('changes:', len(r['changes']), '| blocking:', len(r['blocking'])); [print('-', c['key'], c['summary']) for c in r['changes']]" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always() && hashFiles('source-check/report.json') != ''
        with:
          path: source-check/report.json
          key: source-check-prior-${{ github.run_id }}
      # Candidates are review artefacts. This workflow never commits,
      # publishes, or touches the VPS: promotion is a reviewed commit.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-report
          path: source-check/
