name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spendsense-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-browserless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/harness/package-lock.json
      - run: python scripts/managed-tests.py python
      - run: npm ci --prefix test/harness
      - run: node --check desktop/plugin.js
      - run: bash scripts/node-tests.sh browserless
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/harness/package-lock.json
      - run: npm ci --prefix test/harness
      - run: bash scripts/node-tests.sh browser
  # Keep the existing Linux check name and make browser success part of it.
  tests:
    runs-on: ubuntu-latest
    needs: [linux-browserless, chromium]
    if: ${{ always() }}
    steps:
      - name: Require browserless and Chromium success
        env:
          BROWSERLESS: ${{ needs.linux-browserless.result }}
          CHROMIUM: ${{ needs.chromium.result }}
        run: test "$BROWSERLESS" = success && test "$CHROMIUM" = success
  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tzdata: Windows ships no system zoneinfo database; the DST tests need it.
      # It is data-only (IANA database, no API surface), so it stays floating
      # while the API dependencies stay pinned in requirements-ci.txt (F128).
      - run: python -m pip install -r requirements-ci.txt tzdata
      - run: python scripts/managed-tests.py python
  test-safety-macos:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/managed-tests.py python test_test_guard.py
      - run: python scripts/managed-tests.py python test_test_process.py
      - run: bash scripts/node-tests.sh browserless reports-layout.chromium.test.mjs
