name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx
      - run: python -m unittest discover -s test -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/harness/package-lock.json
      - run: npm ci --prefix test/harness
      - run: node --check desktop/plugin.js
      - run: node --test --test-force-exit test/*.test.mjs
